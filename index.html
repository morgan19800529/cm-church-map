    .leaflet-popup-content { margin: 8px 12px; line-height: 1.45; }
    input, select, textarea { font-size: 16px !important; }
    @media (min-width: 768px) {
      input, select, textarea { font-size: 12px !important; }
    }

        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-sm md:text-base leading-tight">清迈旅居生活与运动地图</h1>

        </div>
      </div>

      <button onclick="setPersonaMode('churches')" id="tab-churches" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">⛪ 全部教会 (18)</button>
      <button onclick="setPersonaMode('saturday')" id="tab-saturday" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🎉 周六活动</button>

    </div>

    <div id="sportsSubFilter" class="bg-blue-50/70 border-t border-blue-100 px-3 py-1.5 flex items-center gap-1.5 text-xs overflow-x-auto no-scrollbar">
      <span class="text-blue-900 font-semibold shrink-0 text-[11px]">运动类型：</span>
      <button onclick="setSportType('all')" id="st-all" class="px-2.5 py-0.5 rounded-full bg-blue-600 text-white font-medium text-[11px] shrink-0">全部运动</button>
      <button onclick="setSportType('pingpong')" id="st-pingpong" class="px-2.5 py-0.5 rounded-full bg-white text-blue-900 border border-blue-200 text-[11px] shrink-0">🏓 乒乓/匹克/羽球</button>
      <button onclick="setSportType('tennis')" id="st-tennis" class="px-2.5 py-0.5 rounded-full bg-white text-blue-900 border border-blue-200 text-[11px] shrink-0">🎾 网球</button>
      <button onclick="setSportType('swim')" id="st-swim" class="px-2.5 py-0.5 rounded-full bg-white text-blue-900 border border-blue-200 text-[11px] shrink-0">🏊 游泳长池</button>

        />

        <span class="text-[11px] text-slate-400">点击卡片看详情/打车</span>
      </div>

        <!-- 动态卡片 -->
      </div>
    </aside>

    <!-- 地图视图 -->

      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">补充详情（如单次费用、营业时间、球台/泳道数量等）</label>

      </form>

        addressTh: "ถนนเชียงใหม่-ฮอด ต.หางดง เชียงใหม่",
        lat: 18.6850,
        lng: 98.9110,
        district: "杭东",
        category: "南郊国际宣教站",
        tel: "",
        languages: ["普通话", "英语"],
        translation: "双语轮换",
        time: "周日 10:30 - 12:00",
        saturdayActivity: "周六下午 16:00 户外草地赞美与儿童自然体验",
        hasSaturday: true,
        sojournerFriendly: true,
        hospitalNear: "距杭东综合医院 5分钟",
        kids: true,
        tips: "杭东深处近自然，适合喜欢田园、不想进城拥堵的南区旅居老人与慢调家庭。"
      },
      {
        id: 18,
        isSport: false,
        nameZh: "生命之泉清迈团契 (Spring of Life)",
        nameEn: "Spring of Life Chiang Mai",
        nameTh: "คริสตจักรสายน้ำแห่งชีวิต",
        addressTh: "ตำบลป่าแดด อำเภอเมือง เชียงใหม่",
        lat: 18.7620,
        lng: 98.9950,
        district: "长康路",
        category: "萍河滨水家庭团契",
        tel: "",
        languages: ["普通话", "粤语"],
        translation: "国粤双语自由交流",
        time: "周日 10:00 - 11:30",
        saturdayActivity: "周六下午 15:00 滨河慢走交流与家庭茶聚",
        hasSaturday: true,
        sojournerFriendly: true,
        hospitalNear: "距清迈市中心医院 8分钟",
        kids: false,
        tips: "靠近巴达区萍河畔，风景优美环境安静，常有广东与大湾区旅居教友聚会交流。"
      }
    ];

    let map;
    let markers = [];
    let userMarker = null;
    let currentPersona = 'all';
    let currentSportType = 'all';
    let isMapModeOnMobile = false;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('all');
    }

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-emerald-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-emerald-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      ['all', 'sports', 'churches', 'saturday', 'sojourner'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-emerald-600 text-white font-medium shadow-xs shrink-0 text-xs";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs";
          }
        }
      });

      // 运动二级子栏显隐控制
      const sportsSub = document.getElementById("sportsSubFilter");
      if (mode === 'sports') {
        sportsSub.classList.remove('hidden');
      } else {
        sportsSub.classList.add('hidden');
      }

      applyFilter();
    }

    function setSportType(type) {
      currentSportType = type;
      ['all', 'pingpong', 'tennis', 'swim', 'snooker', 'gym'].forEach(t => {
        const btn = document.getElementById(`st-${t}`);
        if (btn) {
          if (t === type) {
            btn.className = "px-2.5 py-0.5 rounded-full bg-blue-600 text-white font-medium text-[11px] shrink-0";
          } else {
            btn.className = "px-2.5 py-0.5 rounded-full bg-white text-blue-900 border border-blue-200 text-[11px] shrink-0";
          }
        }
      });
      applyFilter();
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);

        const badge = item.isSport 
          ? `<span class="bg-blue-100 text-blue-800 text-[10px] px-1.5 py-0.5 rounded font-medium">🏅 体育运动</span>` 
          : (item.hasSaturday ? `<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-medium">📅 周六活动</span>` : '');

        const popupContent = `
          <div class="text-xs max-w-[260px]">
            <div class="font-bold text-slate-900 text-sm mb-1">${item.nameZh}</div>
            <div class="mb-1.5">${badge}</div>
            <div class="text-emerald-800 font-semibold mb-1"><i class="fa-regular fa-clock"></i> <b>时间：</b>${item.time}</div>
            ${item.priceInfo ? `<div class="text-blue-700 text-[11px] mb-1 font-medium"><i class="fa-solid fa-tag text-blue-500"></i> ${item.priceInfo}</div>` : ''}
            ${item.hasSaturday ? `<div class="text-amber-700 text-[11px] mb-1.5 leading-snug"><i class="fa-solid fa-star text-amber-500"></i> ${item.saturdayActivity}</div>` : ''}
            <div class="text-slate-500 text-[11px] mb-2"><i class="fa-solid fa-location-dot text-rose-500"></i> ${item.district} · ${item.hospitalNear}</div>
            <button onclick="copyToClipboard('${item.addressTh}', '泰文打车地址')" class="w-full bg-emerald-50 text-emerald-900 py-1.5 rounded-lg text-xs font-semibold mb-1.5 border border-emerald-200 active:bg-emerald-100">
              <i class="fa-regular fa-copy"></i> 复制泰文打车地址
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="block w-full text-center bg-slate-900 text-white py-1.5 rounded-lg text-xs font-semibold">
              导航前往
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.placeId = item.id;
        markers.push(marker);
      });
    }

    function renderCards(dataList) {
      const container = document.getElementById("churchCardList");
      const countEl = document.getElementById("churchCount");
      countEl.textContent = `共匹配 ${dataList.length} 处地点`;

      if (dataList.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-compass text-2xl mb-2 text-emerald-500"></i>
            <p>暂无符合筛选条件的位置</p>
          </div>
        `;
        return;
      }

      container.innerHTML = dataList.map(item => `
        <div id="card-${item.id}" onclick="focusPlaceFromCard(${item.id})" class="bg-white border ${item.isSport ? 'border-blue-200 bg-blue-50/15' : (item.hasSaturday ? 'border-amber-200 bg-amber-50/10' : 'border-slate-200')} rounded-2xl p-3 hover:border-emerald-400 transition cursor-pointer shadow-xs active:bg-slate-50">
          <div class="flex justify-between items-start mb-1.5">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] ${item.isSport ? 'bg-blue-100 text-blue-800' : 'bg-slate-100 text-slate-700'} font-semibold px-2 py-0.5 rounded">
                ${item.isSport ? '<i class="fa-solid fa-medal mr-0.5"></i>' : ''} ${item.category}
              </span>
              ${item.isSport ? '<span class="text-[10px] bg-blue-600 text-white font-bold px-1.5 py-0.5 rounded">健康运动</span>' : ''}
              ${item.hasSaturday && !item.isSport ? '<span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded"><i class="fa-solid fa-star text-amber-600"></i> 周六活动</span>' : ''}
            </div>
            <span class="text-xs text-slate-500 flex items-center gap-1 shrink-0 font-medium">
              <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.district}
              ${item.distance ? `<b class="text-emerald-700 ml-0.5">(${item.distance}km)</b>` : ''}
            </span>
          </div>

          <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameZh}</h3>
          <p class="text-[11px] text-slate-400 mb-2">${item.nameEn}</p>

          <div class="space-y-1.5 text-xs text-slate-700 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 mb-2">
            ${item.priceInfo ? `
              <div class="text-blue-900 font-medium bg-blue-100/60 p-1.5 rounded border border-blue-200/60">
                <i class="fa-solid fa-receipt text-blue-600 mr-1"></i><b>费用参考：</b>${item.priceInfo}
              </div>
            ` : ''}

            ${item.facilityInfo ? `
              <div class="flex items-start gap-1.5">
                <i class="fa-solid fa-layer-group text-slate-400 w-3.5 mt-0.5 shrink-0"></i>
                <span class="text-slate-600"><b>设施规模：</b>${item.facilityInfo}</span>
              </div>
            ` : ''}

            ${item.hasSaturday ? `
              <div class="text-amber-900 font-medium bg-amber-100/50 p-1.5 rounded border border-amber-200/50">
                <i class="fa-solid fa-calendar-day text-amber-600 mr-1"></i><b>${item.isSport ? '球友时段' : '周六活动'}：</b>${item.saturdayActivity}
              </div>
            ` : ''}

            <div class="flex items-center gap-1.5">
              <i class="fa-regular fa-clock text-emerald-600 w-3.5 shrink-0"></i>
              <span><b>开放/聚会：</b>${item.time}</span>
            </div>

            <div class="flex items-center gap-1.5">
              <i class="fa-solid fa-notes-medical text-rose-500 w-3.5 shrink-0"></i>
              <span class="text-slate-600"><b>就医/配套：</b>${item.hospitalNear}</span>
            </div>

            ${item.tel ? `
              <div class="flex items-center gap-1.5 pt-1 border-t border-slate-200/50">
                <i class="fa-solid fa-phone text-emerald-600 w-3.5 shrink-0"></i>
                <a href="tel:${item.tel}" onclick="event.stopPropagation();" class="text-emerald-700 font-semibold underline">联系电话：${item.tel}</a>
              </div>
            ` : ''}
          </div>

          <p class="text-[11px] text-slate-500 mb-2.5 leading-relaxed">
            <i class="fa-regular fa-comment-dots text-slate-400"></i> ${item.tips}
          </p>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="event.stopPropagation(); copyToClipboard('${item.addressTh}', '泰文打车地址')" class="py-2.5 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-xl text-xs transition flex items-center justify-center gap-1 font-semibold border border-emerald-200 active:scale-95">
              <i class="fa-solid fa-taxi text-emerald-700"></i> 复制泰文打车
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" onclick="event.stopPropagation();" class="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs text-center font-semibold transition flex items-center justify-center gap-1 active:scale-95">
              <i class="fa-solid fa-diamond-turn-right text-emerald-400"></i> 导航前往
            </a>
          </div>
        </div>
      `).join("");
    }

    function focusPlaceFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const place = places.find(c => c.id === id);
        const marker = markers.find(m => m.placeId === id);
        if (place && marker) {
          map.flyTo([place.lat, place.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = places.filter(item => {
        // 一级分类
        if (currentPersona === 'sports' && !item.isSport) return false;
        if (currentPersona === 'churches' && item.isSport) return false;
        if (currentPersona === 'saturday' && !item.hasSaturday) return false;
        if (currentPersona === 'sojourner' && !item.sojournerFriendly) return false;

        // 运动二级子类型
        if (currentPersona === 'sports' && currentSportType !== 'all') {
          if (item.sportType !== currentSportType) return false;
        }

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          item.nameEn.toLowerCase().includes(search) || 
          (item.saturdayActivity && item.saturdayActivity.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.category.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#059669",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          places.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          places.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！所有地点已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给 Grab 司机或出示给双条车司机查看。`);
      });
    }

    function openModal() {
      document.getElementById("feedbackModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提报！同工会尽快核准更新。");
      closeModal();
    }

    window.onload = initMap;
  </script>
