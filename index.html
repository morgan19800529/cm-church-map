        </div>
        <div>

          <p class="text-[10px] text-slate-400">慢调旅居 · 周末活动 · 医疗配套</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5">
        <button onclick="locateUser()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1 font-medium">
          <i class="fa-solid fa-location-crosshairs text-emerald-600"></i> 定位
        </button>
        <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-lg shadow-sm transition">
          提报
        </button>
      </div>
    </div>

    <!-- 偏好横向滑动栏 -->
    <div class="bg-emerald-50/50 border-t border-emerald-100/60 px-3 py-1.5 flex items-center gap-1.5 text-xs overflow-x-auto no-scrollbar">
      <button onclick="setPersonaMode('all')" id="tab-all" class="px-3 py-1 rounded-full bg-emerald-600 text-white font-medium shadow-xs shrink-0 text-xs">全部堂会 (18)</button>
      <button onclick="setPersonaMode('saturday')" id="tab-saturday" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🎉 周六活动</button>
      <button onclick="setPersonaMode('sojourner')" id="tab-sojourner" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">🌴 慢调旅居</button>
      <button onclick="setPersonaMode('family')" id="tab-family" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs">👨‍👩‍👧 陪读家庭</button>
    </div>

    <!-- 搜索与下拉 -->
    <div class="bg-slate-50 border-t border-slate-200 px-3 py-1.5 flex items-center gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜堂会名、路名、医院、活动..." 
          class="w-full pl-7 pr-3 py-1 bg-white border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-1 focus:ring-emerald-500"
          oninput="applyFilter()"
        />
      </div>

      <select id="districtFilter" onchange="applyFilter()" class="bg-white border border-slate-200 rounded-lg px-2 py-1 text-slate-700 text-xs focus:outline-none">
        <option value="">全部区域</option>
        <option value="古城">古城区</option>
        <option value="瓦特盖特">瓦特盖特/麦考密克</option>
        <option value="长康路">长康路/萍河</option>
        <option value="湄海">湄海区</option>
        <option value="杭东">杭东区</option>
        <option value="宁曼路">宁曼/清大</option>
        <option value="山甘烹">山甘烹</option>
      </select>
    </div>
  </header>

  <!-- 2. 主展示区域：自适应切换 -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- 列表视图 -->
    <aside id="listView" class="w-full md:w-[440px] h-full bg-white flex flex-col z-10 shrink-0">
      <div class="px-3.5 py-1.5 border-b border-slate-100 flex justify-between items-center text-xs text-slate-500 bg-slate-50">
        <span id="churchCount" class="font-medium">加载中...</span>
        <span class="text-[11px] text-slate-400">点击卡片看详情/打车</span>
      </div>

      <div id="churchCardList" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2.5 space-y-2.5 pb-24 md:pb-6">
        <!-- 动态卡片 -->
      </div>
    </aside>

    <!-- 地图视图 -->
    <main id="mapView" class="hidden md:block flex-1 h-full relative z-0 bg-slate-200">
      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

  <!-- 3. 手机端专属：底部浮动切换胶囊 -->
  <div class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40">
    <button onclick="toggleMobileView()" id="mobileToggleBtn" class="bg-slate-900/90 backdrop-blur text-white px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-xs font-semibold active:scale-95 transition tracking-wide border border-white/10">
      <i class="fa-solid fa-map text-emerald-400"></i>
      <span id="toggleText">切换到大地图模式</span>
    </button>
  </div>

  <!-- 4. 纠错提报弹窗 -->
  <div id="feedbackModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">

          <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 提交/纠错堂会信息
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">✕</button>
      </div>

      <form onsubmit="handleFeedbackSubmit(event)" class="space-y-2.5 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">堂会名称</label>
          <input required type="text" id="fbName" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50" placeholder="如：清迈某某教会" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">补充详情（时间、周六活动等）</label>
          <textarea required id="fbContent" rows="3" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50" placeholder="如：周六上午有长者聚会等"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-1">
          <button type="button" onclick="closeModal()" class="px-3.5 py-1.5 border border-slate-200 rounded-lg text-slate-600">取消</button>
          <button type="submit" class="px-4 py-1.5 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">确认提交</button>
        </div>
      </form>

    let map;
    let markers = [];
    let userMarker = null;
    let currentPersona = 'all';
    let isMapModeOnMobile = false;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('all');
    }

    function toggleMobileView() {
      const listView = document.getElementById("listView");
      const mapView = document.getElementById("mapView");
      const toggleText = document.getElementById("toggleText");
      const toggleIcon = document.querySelector("#mobileToggleBtn i");

      isMapModeOnMobile = !isMapModeOnMobile;

      if (isMapModeOnMobile) {
        listView.classList.add("hidden");
        mapView.classList.remove("hidden");
        toggleText.textContent = "返回查看列表";
        toggleIcon.className = "fa-solid fa-list-ul text-emerald-400";
        setTimeout(() => map.invalidateSize(), 200);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        toggleText.textContent = "切换到大地图模式";
        toggleIcon.className = "fa-solid fa-map text-emerald-400";
      }
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      ['all', 'saturday', 'sojourner', 'family'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-emerald-600 text-white font-medium shadow-xs shrink-0 text-xs";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0 text-xs";
          }
        }
      });

      applyFilter();
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);

        const popupContent = `
          <div class="text-xs max-w-[260px]">
            <div class="font-bold text-slate-900 text-sm mb-1">${item.nameZh}</div>
            <div class="text-emerald-800 font-semibold mb-1"><i class="fa-regular fa-clock"></i> ${item.time}</div>
            ${item.hasSaturday ? `<div class="text-amber-700 text-[11px] mb-1.5 leading-snug"><i class="fa-solid fa-star text-amber-500"></i> ${item.saturdayActivity}</div>` : ''}
            <div class="text-slate-500 text-[11px] mb-2"><i class="fa-solid fa-hospital text-rose-500"></i> ${item.hospitalNear}</div>
            <button onclick="copyToClipboard('${item.addressTh}', '泰文打车地址')" class="w-full bg-emerald-50 text-emerald-900 py-1.5 rounded-lg text-xs font-semibold mb-1.5 border border-emerald-200 active:bg-emerald-100">
              <i class="fa-regular fa-copy"></i> 复制泰文打车地址
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="block w-full text-center bg-slate-900 text-white py-1.5 rounded-lg text-xs font-semibold">
              导航路线
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.churchId = item.id;
        markers.push(marker);
      });
    }

    function renderCards(dataList) {
      const container = document.getElementById("churchCardList");
      const countEl = document.getElementById("churchCount");
      countEl.textContent = `共收录 ${dataList.length} 家堂会`;

      if (dataList.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-compass text-2xl mb-2 text-emerald-500"></i>
            <p>暂无符合筛选条件的堂会</p>
          </div>
        `;
        return;
      }

      container.innerHTML = dataList.map(item => `
        <div id="card-${item.id}" onclick="focusChurchFromCard(${item.id})" class="bg-white border ${item.hasSaturday ? 'border-amber-200 bg-amber-50/10' : 'border-slate-200'} rounded-2xl p-3 hover:border-emerald-400 transition cursor-pointer shadow-xs active:bg-slate-50">
          <div class="flex justify-between items-start mb-1.5">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded">${item.category}</span>
              ${item.hasSaturday ? '<span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded"><i class="fa-solid fa-star text-amber-600"></i> 周六活动</span>' : ''}
            </div>
            <span class="text-xs text-slate-500 flex items-center gap-1 shrink-0 font-medium">
              <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.district}
              ${item.distance ? `<b class="text-emerald-700 ml-0.5">(${item.distance}km)</b>` : ''}
            </span>
          </div>

          <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameZh}</h3>
          <p class="text-[11px] text-slate-400 mb-2">${item.nameEn}</p>

          <div class="space-y-1.5 text-xs text-slate-700 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100 mb-2">
            ${item.hasSaturday ? `
              <div class="text-amber-900 font-medium bg-amber-100/50 p-1.5 rounded border border-amber-200/50">
                <i class="fa-solid fa-calendar-day text-amber-600 mr-1"></i><b>周六：</b>${item.saturdayActivity}
              </div>
            ` : ''}

            <div class="flex items-center gap-1.5">
              <i class="fa-regular fa-clock text-emerald-600 w-3.5 shrink-0"></i>
              <span><b>主日：</b>${item.time}</span>
            </div>

            <div class="flex items-center gap-1.5">
              <i class="fa-solid fa-language text-indigo-600 w-3.5 shrink-0"></i>
              <span><b>语言：</b>${item.languages.join("、")} <span class="text-slate-400">(${item.translation})</span></span>
            </div>

            <div class="flex items-center gap-1.5">
              <i class="fa-solid fa-hospital text-rose-500 w-3.5 shrink-0"></i>
              <span class="text-rose-700"><b>就医：</b>${item.hospitalNear}</span>
            </div>

            ${item.tel ? `
              <div class="flex items-center gap-1.5 pt-1 border-t border-slate-200/50">
                <i class="fa-solid fa-phone text-emerald-600 w-3.5 shrink-0"></i>
                <a href="tel:${item.tel}" onclick="event.stopPropagation();" class="text-emerald-700 font-semibold underline">拨打电话：${item.tel}</a>
              </div>
            ` : ''}
          </div>

          <p class="text-[11px] text-slate-500 mb-2.5 leading-relaxed">
            <i class="fa-regular fa-comment-dots text-slate-400"></i> ${item.tips}
          </p>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="event.stopPropagation(); copyToClipboard('${item.addressTh}', '泰文打车地址')" class="py-2.5 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-xl text-xs transition flex items-center justify-center gap-1 font-semibold border border-emerald-200 active:scale-95">
              <i class="fa-solid fa-taxi text-emerald-700"></i> 复制泰文打车
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" onclick="event.stopPropagation();" class="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs text-center font-semibold transition flex items-center justify-center gap-1 active:scale-95">
              <i class="fa-solid fa-diamond-turn-right text-emerald-400"></i> 导航前往
            </a>
          </div>
        </div>
      `).join("");
    }

    function focusChurchFromCard(id) {
      if (window.innerWidth < 768) {
        toggleMobileView();
      }
      setTimeout(() => {
        const church = churches.find(c => c.id === id);
        const marker = markers.find(m => m.churchId === id);
        if (church && marker) {
          map.flyTo([church.lat, church.lng], 14, { duration: 1 });
          marker.openPopup();
        }
      }, 250);
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;

      const filtered = churches.filter(item => {
        if (currentPersona === 'saturday' && !item.hasSaturday) return false;
        if (currentPersona === 'sojourner' && !item.sojournerFriendly) return false;
        if (currentPersona === 'family' && !item.kids) return false;

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          item.nameEn.toLowerCase().includes(search) || 
          (item.saturdayActivity && item.saturdayActivity.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);

        return matchesSearch && matchesDistrict;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("手机暂不支持定位功能");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#059669",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          churches.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          churches.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
          alert("已定位成功！堂会已按与您的距离由近到远重新排序。");
        },
        err => {
          alert("无法获取定位权限，请在手机设置中允许浏览器访问位置。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给 Grab 司机或出示给双条车司机查看。`);
      });
    }

    function openModal() {
      document.getElementById("feedbackModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提报！同工会尽快核准更新。");
      closeModal();
    }

    window.onload = initMap;
