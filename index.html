    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .leaflet-popup-content-wrapper { border-radius: 14px; padding: 4px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }

<body class="bg-slate-100 text-slate-800 h-screen w-screen flex flex-col overflow-hidden font-sans">

        </div>
      </div>

        <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1">
          <i class="fa-solid fa-circle-plus"></i> 提报/纠错
        </button>
      </div>
    </div>

      <button onclick="setPersonaMode('saturday')" id="tab-saturday" class="px-3 py-1 rounded-full bg-emerald-600 text-white font-medium shadow-xs shrink-0">🎉 周六有活动</button>
      <button onclick="setPersonaMode('sojourner')" id="tab-sojourner" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0">🌴 慢调旅居 (母语/近医院)</button>
      <button onclick="setPersonaMode('family')" id="tab-family" class="px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0">👨‍👩‍👧 陪读家庭 (国际学校走廊)</button>

    </div>

    <!-- 搜索与区域过滤 -->

  <!-- 纠错提报弹窗 -->

        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <form onsubmit="handleFeedbackSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-700 mb-1">堂会/团契名称</label>
          <input required type="text" id="fbName" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white" placeholder="如：清迈某某教会" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">补充或更正详情（时间、活动、电话等）</label>
          <textarea required id="fbContent" rows="3" class="w-full p-2 border border-slate-200 rounded-lg bg-slate-50 focus:bg-white" placeholder="如：周六上午有赞美操；主日时间改为上午 10:00 等"></textarea>

    let map;
    let markers = [];
    let userMarker = null;
    let currentPersona = 'saturday';

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([18.7883, 98.9853], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      setPersonaMode('saturday');
    }

    function setPersonaMode(mode) {
      currentPersona = mode;
      
      ['saturday', 'sojourner', 'family', 'all'].forEach(m => {
        const btn = document.getElementById(`tab-${m}`);
        if (btn) {
          if (m === mode) {
            btn.className = "px-3 py-1 rounded-full bg-emerald-600 text-white font-medium shadow-xs shrink-0";
          } else {
            btn.className = "px-3 py-1 rounded-full bg-white text-slate-700 border border-slate-200 font-medium shadow-xs shrink-0";
          }
        }
      });

      applyFilter();
    }

    function renderMarkers(dataList) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      dataList.forEach(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.nameZh }).addTo(map);

        const satBadge = item.hasSaturday 
          ? `<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-medium">📅 周六活动</span>` 
          : '';

        const popupContent = `
          <div class="text-xs">
            <div class="font-bold text-slate-900 text-sm mb-0.5">${item.nameZh}</div>
            <div class="text-slate-500 text-[11px] mb-1">${item.nameEn}</div>
            <div class="mb-1.5">${satBadge}</div>
            <div class="text-emerald-800 font-medium mb-1"><i class="fa-regular fa-clock"></i> <b>主日：</b>${item.time}</div>
            ${item.hasSaturday ? `<div class="text-amber-700 font-medium mb-1.5"><i class="fa-solid fa-calendar-check"></i> <b>周六：</b>${item.saturdayActivity}</div>` : ''}
            <div class="text-slate-500 text-[11px] mb-2"><i class="fa-solid fa-hospital text-rose-500"></i> ${item.hospitalNear}</div>
            <button onclick="copyToClipboard('${item.addressTh}', '泰文打车地址')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 py-1.5 rounded text-xs font-medium transition mb-1">
              <i class="fa-regular fa-copy"></i> 复制泰文打车地址
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" class="block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded text-xs font-medium">
              导航前往
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);
        marker.churchId = item.id;
        markers.push(marker);
      });
    }

    function renderCards(dataList) {
      const container = document.getElementById("churchCardList");
      const countEl = document.getElementById("churchCount");

            <i class="fa-solid fa-compass text-2xl mb-2 text-emerald-500"></i>
            <p>该偏好下暂无匹配，可切换至“全部堂会”浏览</p>
          </div>
        `;
        return;
      }

      container.innerHTML = dataList.map(item => `
        <div id="card-${item.id}" onclick="focusChurch(${item.id})" class="bg-white border ${item.hasSaturday ? 'border-amber-200 bg-amber-50/15' : 'border-slate-200'} rounded-2xl p-3.5 hover:border-emerald-400 transition cursor-pointer shadow-xs">
          <div class="flex justify-between items-start mb-1.5">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] bg-slate-100 text-slate-700 font-semibold px-2 py-0.5 rounded">${item.category}</span>
              ${item.hasSaturday ? '<span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded"><i class="fa-solid fa-star text-amber-600"></i> 周六活动</span>' : ''}
              ${item.sojournerFriendly ? '<span class="text-[10px] bg-emerald-100 text-emerald-800 font-medium px-1.5 py-0.5 rounded">慢调旅居</span>' : ''}
            </div>
            <span class="text-xs text-slate-500 flex items-center gap-1 shrink-0">
              <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.district}
              ${item.distance ? `<b class="text-emerald-700 ml-1">(${item.distance}km)</b>` : ''}
            </span>
          </div>

          <h3 class="font-bold text-slate-900 text-base leading-snug">${item.nameZh}</h3>
          <p class="text-xs text-slate-400 mb-2">${item.nameEn}</p>

          <div class="space-y-2 text-xs text-slate-700 bg-white/95 p-2.5 rounded-xl border border-slate-100 mb-2.5">
            ${item.hasSaturday ? `
              <div class="flex items-start gap-2 bg-amber-50 p-2 rounded-lg border border-amber-100/80">
                <i class="fa-solid fa-calendar-day text-amber-600 mt-0.5 w-3.5 shrink-0"></i>
                <div>
                  <span class="font-bold text-amber-950">周六活动：</span>
                  <span class="text-amber-900 leading-relaxed">${item.saturdayActivity}</span>
                </div>
              </div>
            ` : ''}

            <div class="flex items-center gap-2">
              <i class="fa-regular fa-clock text-emerald-600 w-3.5 shrink-0"></i>
              <span><b>主日聚会：</b>${item.time}</span>
            </div>

            <div class="flex items-center gap-2">
              <i class="fa-solid fa-language text-indigo-600 w-3.5 shrink-0"></i>
              <span><b>语言交流：</b>${item.languages.join("、")} <span class="text-slate-400">(${item.translation})</span></span>
            </div>

            <div class="flex items-center gap-2">
              <i class="fa-solid fa-hospital text-rose-500 w-3.5 shrink-0"></i>
              <span class="text-rose-700"><b>就医配套：</b>${item.hospitalNear}</span>
            </div>

            ${item.tel ? `
              <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
                <i class="fa-solid fa-phone text-emerald-600 w-3.5 shrink-0"></i>
                <a href="tel:${item.tel}" onclick="event.stopPropagation();" class="text-emerald-700 font-medium hover:underline">堂会电话：${item.tel}</a>
              </div>
            ` : ''}
          </div>

          <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">
            <i class="fa-regular fa-comment-dots text-slate-400"></i> ${item.tips}
          </p>

          <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
            <button onclick="event.stopPropagation(); copyToClipboard('${item.addressTh}', '泰文打车地址')" class="flex-1 py-2 px-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 rounded-lg text-xs transition flex items-center justify-center gap-1 font-medium border border-emerald-200">
              <i class="fa-solid fa-taxi text-emerald-700"></i> 复制泰文打车
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${item.lat},${item.lng}" target="_blank" onclick="event.stopPropagation();" class="flex-1 py-2 px-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-1">
              <i class="fa-solid fa-diamond-turn-right text-emerald-400"></i> 导航前往
            </a>
          </div>
        </div>
      `).join("");
    }

    function focusChurch(id) {
      const church = churches.find(c => c.id === id);
      const marker = markers.find(m => m.churchId === id);
      if (church && marker) {
        map.flyTo([church.lat, church.lng], 14, { duration: 1 });
        marker.openPopup();

        document.querySelectorAll('[id^="card-"]').forEach(el => el.classList.remove('ring-2', 'ring-emerald-500'));
        const activeCard = document.getElementById(`card-${id}`);
        if (activeCard) {
          activeCard.classList.add('ring-2', 'ring-emerald-500');
        }
      }
    }

    function applyFilter() {
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;
      const lang = document.getElementById("langFilter").value;

      const filtered = churches.filter(item => {
        if (currentPersona === 'saturday' && !item.hasSaturday) return false;
        if (currentPersona === 'sojourner' && !item.sojournerFriendly) return false;
        if (currentPersona === 'family' && !item.kids) return false;

        const matchesSearch = !search || 
          item.nameZh.toLowerCase().includes(search) || 
          item.nameEn.toLowerCase().includes(search) || 
          (item.saturdayActivity && item.saturdayActivity.toLowerCase().includes(search)) ||
          item.tips.toLowerCase().includes(search) ||
          item.district.toLowerCase().includes(search);

        const matchesDistrict = !district || item.district.includes(district);
        const matchesLang = !lang || item.languages.includes(lang);

        return matchesSearch && matchesDistrict && matchesLang;
      });

      renderMarkers(filtered);
      renderCards(filtered);
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("浏览器不支持定位");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const uLat = pos.coords.latitude;
          const uLng = pos.coords.longitude;

          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.circleMarker([uLat, uLng], {
            radius: 8,
            fillColor: "#059669",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map).bindPopup("<b>您所在的位置</b>").openPopup();

          map.setView([uLat, uLng], 13);

          churches.forEach(c => {
            c.distance = calculateDistance(uLat, uLng, c.lat, c.lng).toFixed(1);
          });
          churches.sort((a, b) => parseFloat(a.distance) - parseFloat(b.distance));
          applyFilter();
        },
        err => {
          alert("无法获取定位，请确认手机已开启 GPS 定位权限。");
        }
      );
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`已复制【${label}】：\n\n${text}\n\n可以直接发给 Grab 司机或出示给双条车司机查看。`);
      });
    }

    function openModal() {
      document.getElementById("feedbackModal").classList.remove("hidden");
    }
    function closeModal() {
      document.getElementById("feedbackModal").classList.add("hidden");
    }
    function handleFeedbackSubmit(e) {
      e.preventDefault();
      alert("感谢提供信息！同工核实后会同步至清迈周六与旅居活动地图。");
      closeModal();
    }

    window.onload = initMap;
  </script>
